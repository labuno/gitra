name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION_PKG: github.com/zhanhd/gitra/internal/version.Version

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  # Create the release once so every build job can attach its own file
  # directly: one copy per artefact, no intermediate workflow artefacts.
  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          ## 该下载哪个文件？

          **macOS 用户（推荐）**：下载 `Gitra.app.zip` → 解压 → 双击 `Gitra.app`
          （首次打开若提示“身份不明的开发者”，右键 → 打开即可）

          **命令行 / Linux / Windows**：下载对应平台的 `gitra-<系统>-<架构>`。
          建议选 `.zip` 版本：解压后自带可执行权限；直接下载裸二进制会丢失该权限，
          需要自己 `chmod +x`（macOS / Linux）后才能运行。

          **校验完整性**：`checksums.txt` 是每个文件的 sha256。
          NOTES
          sed -i 's/^          //' release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and attach the binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X ${VERSION_PKG}=${VERSION}" \
            -o "dist/gitra-${GOOS}-${GOARCH}${ext}" ./cmd/gitra
          # A zip keeps the executable bit, which browsers strip on raw downloads.
          (cd dist && zip -q "gitra-${GOOS}-${GOARCH}${ext}.zip" "gitra-${GOOS}-${GOARCH}${ext}")
          gh release upload "$TAG" "dist/gitra-${GOOS}-${GOARCH}${ext}" "dist/gitra-${GOOS}-${GOARCH}${ext}.zip" --clobber

  macos-app:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and attach the macOS app bundle
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/build-app.sh
          ./dist/Gitra.app/Contents/Resources/gitra --version
          ditto -c -k --keepParent dist/Gitra.app dist/Gitra.app.zip
          gh release upload "$TAG" dist/Gitra.app.zip --clobber

  checksums:
    needs: [build, macos-app]
    runs-on: ubuntu-latest
    steps:
      - name: Generate checksums from the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber
          rm -f assets/checksums.txt
          (cd assets && sha256sum * > checksums.txt && cat checksums.txt)
          gh release upload "$TAG" assets/checksums.txt --clobber
          gh release view "$TAG" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'
