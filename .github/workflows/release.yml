name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION_PKG: github.com/zhanhd/gitra/internal/version.Version

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: python3 scripts/test-release-workflow.py
      - run: python3 scripts/test-build-windows.py

  # Create the release once so every build job can attach its own file
  # directly: one copy per artefact, no intermediate workflow artefacts.
  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          notes_file="docs/releases/${TAG}.md"
          if [ ! -s "$notes_file" ]; then
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi
          release_args=(release create "$TAG" --title "$TAG" --notes-file "$notes_file")
          case "$TAG" in
            *-rc[0-9]*) release_args+=(--prerelease --latest=false) ;;
          esac
          gh "${release_args[@]}"

  macos-app:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and attach the macOS app zip
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/build-app.sh
          ./dist/Gitra.app/Contents/Resources/gitra --version
          lipo -info dist/Gitra.app/Contents/Resources/gitra
          codesign --verify --deep --strict dist/Gitra.app

          mkdir -p dist/Gitra-macOS
          ditto dist/Gitra.app "dist/Gitra-macOS/Gitra.app"
          cat > "dist/Gitra-macOS/第一次使用请看这里.txt" <<'TXT'
          gitra —— 让每个文件夹用对账号

          怎么打开（两步）：

          1. 双击 Gitra.app。
          2. 如果 macOS 提示“无法验证开发者 / 无法检查是否包含恶意软件”，
             就打开「系统设置 → 隐私与安全性」，在“安全性”区域点「仍要打开」，
             然后回到这里再双击一次 Gitra.app。这个提示只需要处理一次。

          打开后会弹出一个“终端”窗口，里面就是 gitra 界面，全程用键盘操作：
          ↑↓←→ 选择 · Enter 确认 · Esc 返回 · Q 退出（界面底部也写着快捷键）。

          第一次使用：选「登录 GitHub」→ 在浏览器里点一次授权 →
          再把你的项目文件夹绑定给这个账号（可以一次选多个文件夹）。

          为什么会被拦截：gitra 是开源软件，没有购买 Apple 的付费签名证书，
          macOS 会对“从网上下载的非 App Store 应用”做例行提醒，它不是病毒告警。
          TXT
          sed -i '' 's/^          //' "dist/Gitra-macOS/第一次使用请看这里.txt" || true
          ditto -c -k --keepParent dist/Gitra-macOS dist/Gitra-macOS.zip
          gh release upload "$TAG" dist/Gitra-macOS.zip --clobber

  windows-app:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and attach the Windows portable zip
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/build-windows.py --version "$VERSION"
          python scripts/test-windows-package.py --version "$VERSION"
          gh release upload "$TAG" dist/Gitra-Windows-x64.zip --clobber

  checksums:
    needs: [macos-app, windows-app]
    runs-on: ubuntu-latest
    steps:
      - name: Generate checksums from the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber
          rm -f assets/checksums.txt
          (cd assets && sha256sum * > checksums.txt && cat checksums.txt)
          gh release upload "$TAG" assets/checksums.txt --clobber
          gh release view "$TAG" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'
