name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION_PKG: github.com/zhanhd/gitra/internal/version.Version

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  # Create the release once so every build job can attach its own file
  # directly: one copy per artefact, no intermediate workflow artefacts.
  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          ## 下载哪一个？

          **macOS**：下载 `Gitra-macOS.zip` → 双击解压 → 双击解压出来的 `Gitra.app`。
          文件夹里的 `第一次使用请看这里.txt` 写好了首次打开被系统拦截时怎么办。

          **Linux / Windows / 想用命令行**：下载对应平台的 `gitra-<系统>-<架构>.zip`，
          解压后即可运行。

          发布里只提供 zip：浏览器直接下载裸二进制会丢掉可执行权限（双击会被当文本打开）。

          **校验完整性**：`checksums.txt` 是所有文件的 sha256。
          NOTES
          sed -i 's/^          //' release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and attach the platform zip
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X ${VERSION_PKG}=${VERSION}" \
            -o "dist/gitra-${GOOS}-${GOARCH}${ext}" ./cmd/gitra
          # zip 保住可执行权限：浏览器下载裸文件会丢掉它。
          (cd dist && zip -q "gitra-${GOOS}-${GOARCH}${ext}.zip" "gitra-${GOOS}-${GOARCH}${ext}")
          gh release upload "$TAG" "dist/gitra-${GOOS}-${GOARCH}${ext}.zip" --clobber

  macos-app:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and attach the macOS app zip
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/build-app.sh
          ./dist/Gitra.app/Contents/Resources/gitra --version
          lipo -info dist/Gitra.app/Contents/Resources/gitra
          codesign --verify --deep --strict dist/Gitra.app

          mkdir -p dist/Gitra-macOS
          ditto dist/Gitra.app "dist/Gitra-macOS/Gitra.app"
          cat > "dist/Gitra-macOS/第一次使用请看这里.txt" <<'TXT'
          gitra —— 让每个文件夹用对账号

          怎么打开（两步）：

          1. 双击 Gitra.app。
          2. 如果 macOS 提示“无法验证开发者 / 无法检查是否包含恶意软件”，
             就打开「系统设置 → 隐私与安全性」，在“安全性”区域点「仍要打开」，
             然后回到这里再双击一次 Gitra.app。这个提示只需要处理一次。

          打开后会弹出一个“终端”窗口，里面就是 gitra 界面，全程用键盘操作：
          ↑↓←→ 选择 · Enter 确认 · Esc 返回 · Q 退出（界面底部也写着快捷键）。

          第一次使用：选「登录 GitHub」→ 在浏览器里点一次授权 →
          再把你的项目文件夹绑定给这个账号（可以一次选多个文件夹）。

          为什么会被拦截：gitra 是开源软件，没有购买 Apple 的付费签名证书，
          macOS 会对“从网上下载的非 App Store 应用”做例行提醒，它不是病毒告警。
          TXT
          sed -i '' 's/^          //' "dist/Gitra-macOS/第一次使用请看这里.txt" || true
          ditto -c -k --keepParent dist/Gitra-macOS dist/Gitra-macOS.zip
          gh release upload "$TAG" dist/Gitra-macOS.zip --clobber

  checksums:
    needs: [build, macos-app]
    runs-on: ubuntu-latest
    steps:
      - name: Generate checksums from the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber
          rm -f assets/checksums.txt
          (cd assets && sha256sum * > checksums.txt && cat checksums.txt)
          gh release upload "$TAG" assets/checksums.txt --clobber
          gh release view "$TAG" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'
