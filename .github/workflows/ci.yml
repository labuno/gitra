name: ci

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "以下文件需要 gofmt："
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: python3 scripts/test-release-workflow.py
      - run: python3 scripts/test-build-windows.py

  macos-app-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the macOS app bundle
        run: ./scripts/build-app.sh
      - name: Verify the bundle
        run: |
          test -x dist/Gitra.app/Contents/MacOS/GitraLauncher
          test -f dist/Gitra.app/Contents/Info.plist
          dist/Gitra.app/Contents/Resources/gitra --version

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows runtime contracts
        run: >-
          go test ./internal/adapters/storage ./internal/adapters/gitcli
          ./internal/adapters/secretstore ./internal/strategies/auth/sshkey
          ./internal/presentation/tui ./internal/e2e
          -run 'TestWindows|TestFileLocker|TestManagedFileHelperQuotes|TestBuildGitConfig|TestInitialize|TestPlainFolder|TestPickerStartDirectory|TestFirstPublish|TestLoginBindAndCredentialRetrieval|TestUnbindRestoresPreBindState'
          -count=1 -timeout=120s
      - name: Build Windows portable package
        run: python scripts/build-windows.py --version ci
      - name: Verify Windows portable package
        run: python scripts/test-windows-package.py --version ci
      - uses: actions/upload-artifact@v4
        with:
          name: Gitra-Windows-x64
          path: dist/Gitra-Windows-x64.zip
          retention-days: 14
